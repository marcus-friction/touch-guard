name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: [self-hosted, linux, x64, do-dev]

    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-bin
      - name: Build and validate
        run: make package
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: touch-guard-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: [self-hosted, linux, x64, do-dev]
    permissions:
      contents: write

    steps:
      - name: Download deliverables
        uses: actions/download-artifact@v4
        with:
          name: touch-guard-${{ github.sha }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
              dist/*.zip dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              "${release_flags[@]}"
